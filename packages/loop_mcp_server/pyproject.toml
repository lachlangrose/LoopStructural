[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-mcp-server"
description = "MCP server for LoopStructural geological modeling library"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mcp>=0.1.0",
    "loop-api>=0.1.0",
    "loop-engine>=0.1.0",
    "loop-model>=0.1.0",
    "loop-common>=0.1.0",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["loop_mcp_server", "loop_mcp_server.*"]

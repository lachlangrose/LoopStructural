[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-visualization"
description = "3D visualization interface for Loop 2.0 using pyvista"
version = "0.1.0"
authors = [{ name = "Lachlan Grose", email = "lachlan.grose@monash.edu" }]
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "earth sciences",
    "geology",
    "3-D modelling",
    "structural geology",
    "visualization",
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.18",
    "pyvista>=0.42",
    "loop-common",
    "loop-engine",
]

[project.optional-dependencies]
jupyter = ["pyvista[jupyter]"]
trame = ["trame>=3.0", "trame-vuetify>=3.0", "trame-vtk>=2.0"]
all = ["pyvista[all]"]

[project.scripts]
loop-trame-app = "loop_visualization.trame.app:main"

[project.urls]
Documentation = "https://Loop3d.org/LoopStructural/"
"Bug Tracker" = "https://github.com/loop3d/LoopStructural2.0/issues"
"Source Code" = "https://github.com/loop3d/LoopStructural2.0"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loop_visualization", "loop_visualization.*"]
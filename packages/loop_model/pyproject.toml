[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-model"
description = "Geological modeling utilities for LoopStructural"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy", "pandas", "networkx", "pydantic>=2", "pyyaml", "loop-common"]
[tool.setuptools.packages.find]
where = ["src"]
include = ["loop_model", "loop_model.*"]
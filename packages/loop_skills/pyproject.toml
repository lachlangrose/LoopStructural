[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-skills"
description = "Agent skills for the Loop libraries"
version = "0.1.0"
requires-python = ">=3.9"
authors = [{ name = "Lachlan Grose", email = "lachlan.grose@monash.edu" }]
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["packaging", "pyyaml"]

[project.optional-dependencies]
tests = ["pytest"]
checks = ["LoopStructural", "map2loop"]

[project.scripts]
loop-skills = "loop_skills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loop_skills", "loop_skills.*"]

[tool.setuptools.package-data]
loop_skills = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
markers = ["names: needs LoopStructural and map2loop"]

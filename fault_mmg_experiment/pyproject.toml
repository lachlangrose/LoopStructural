[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fault-mmg-experiment"
version = "0.1.0"
description = "Reproducible MMG3D fault and offset horizon experiment"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyvista>=0.44", "vtk>=9.3", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_experiment.py" = ["E402"]  # Supports execution without installing the package.
"scripts/run_two_faults.py" = ["E402"]
"scripts/remesh_results.py" = ["E402"]
"scripts/compare_local_remesh.py" = ["E402"]
"scripts/run_local_workflow.py" = ["E402"]
